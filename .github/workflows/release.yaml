name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - alpha
          - beta
          - rc
      dryRun:
        description: 'Dry run'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Debug mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: ./nx-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.releaseType }}
          dry-run: ${{ inputs.dryRun }}
          debug: ${{ inputs.debug }}
          skip-build: true
          skip-publish: true
