name: Release

on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Release type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - alpha
          - beta
          - rc
      dryRun:
        description: 'Dry run'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Debug mode'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'pplancq'
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./setup-node
        with:
          use-mise: true

      - name: Install package
        run: npm ci --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_EMAIL: release[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: release[bot]
          GIT_COMMITTER_EMAIL: release[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: release[bot]
        run: |
          RELEASE_TYPE="${{ github.event.inputs.releaseType }}"
          ARGS=("--skip-publish")

          if [ "$RELEASE_TYPE" != "stable" ]; then
            ARGS=("prerelease" "${ARGS[@]}")
            ARGS+=("--preid" "$RELEASE_TYPE")
          fi

          if [ "${{ github.event.inputs.dryRun }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            ARGS+=("--verbose")
          fi

          npx nx release "${ARGS[@]}"
